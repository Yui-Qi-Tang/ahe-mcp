name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: MCP verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check public files for machine paths
        run: node --test scripts/check-public-paths.test.mjs && node scripts/check-public-paths.mjs

      - name: Verify MCP module
        run: make verify

      - name: Run race tests
        run: go test -mod=readonly -p 2 -race -count=1 ./...
