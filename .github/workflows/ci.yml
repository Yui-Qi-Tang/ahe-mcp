name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Race tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Run race tests
        run: go test -race ./...
