name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: MCP and Detective verification
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=webkit2_41
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/detective/frontend/package-lock.json

      - name: Check public files for machine paths
        run: node --test scripts/check-public-paths.test.mjs && node scripts/check-public-paths.mjs

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Verify shared module and frontend
        run: make verify

      - name: Run race tests
        run: go test -mod=readonly -p 2 -race -count=1 ./...
